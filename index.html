<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pulgadas a Galones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        label {
            font-size: 1.2rem;
            color: #aaa;
            display: block;
            margin-bottom: 10px;
        }
        /* Campo para introducir las pulgadas de gran tamaño */
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            text-align: center;
            background-color: #222;
            border: 2px solid #444;
            color: #fff;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        input[type="number"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .title-result {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 5px;
        }
        /* Número gigante de galones adaptado para móviles */
        .number-display {
            font-size: 18vw;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        @media (min-width: 600px) {
            .number-display {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <label for="inchesInput">Introduce las Pulgadas:</label>
        <input type="number" id="inchesInput" placeholder="0" step="any">

        <div class="title-result">Resultado en Galones:</div>
        <div class="number-display" id="gallonsResult">0.00</div>
    </div>

    <script>
        const inchesInput = document.getElementById('inchesInput');
        const gallonsResult = document.getElementById('gallonsResult');

        // Factor de conversión de ejemplo (Modifícalo según tu fórmula real)
        // Ejemplo: 1 pulgada = 5.42 galones
        const FACTOR_CONVERSION = 5.42; 

        // Función que se ejecuta automáticamente al escribir
        function calcularGalones() {
            const inches = parseFloat(inchesInput.value);

            if (isNaN(inches) || inchesInput.value === "") {
                gallonsResult.innerText = "0.00";
            } else {
                // Realiza el cálculo matemático
                const gallons = inches * FACTOR_CONVERSION;
                // Muestra el resultado redondeado a 2 decimales
                gallonsResult.innerText = gallons.toFixed(2);
            }
        }

        // Escucha en tiempo real cada vez que el usuario escribe o borra
        inchesInput.addEventListener('input', calcularGalones);
    </script>
</body>
</html>
