        function calcularCombustible() {
            let inputVal = document.getElementById("pulgadas").value.trim();
            const tarjeta = document.getElementById("tarjetaResultado");
            const txtResultado = document.getElementById("resultado");

            // Si el campo está vacío, reseteamos el visual
            if (inputVal === "") {
                txtResultado.innerText = "-";
                tarjeta.style.borderColor = "#333";
                txtResultado.style.color = "#ffffff";
                return;
            }
            
            // Reemplazar coma por punto por si el teclado móvil lo introduce
            inputVal = inputVal.replace(',', '.');
            
            // Intentamos parsear para buscar la clave correcta
            let numero = parseFloat(inputVal);
            let claveBusqueda = isNaN(numero) ? inputVal : numero.toString();

            let resultado = tablaConversion[claveBusqueda];

            if (resultado === undefined) {
                txtResultado.innerText = "N/D"; // No Disponible
                txtResultado.style.color = "#888888";
                tarjeta.style.borderColor = "#333";
                return;
            }

            // Mostrar el resultado (se formatea a 2 decimales para que se vea ordenado)
            txtResultado.innerText = resultado.toFixed(2);

            // Lógica de colores según el resultado:
            // - Verde cuando está encima de 3000
            // - Amarillo cuando está entre 2000 y 2009
            // - Rojo cuando está en menos de 1800
            
            if (resultado > 3000) {
                tarjeta.style.borderColor = "#00FF00"; // Verde
                txtResultado.style.color = "#00FF00";
            } else if (resultado >= 2000 && resultado <= 2009) {
                tarjeta.style.borderColor = "#FFD700"; // Amarillo
                txtResultado.style.color = "#FFD700";
            } else if (resultado < 1800) {
                tarjeta.style.borderColor = "#FF0000"; // Rojo
                txtResultado.style.color = "#FF0000";
            } else {
                tarjeta.style.borderColor = "#555555"; // Neutro
                txtResultado.style.color = "#ffffff"; // Blanco
            }
        }
    </script>
